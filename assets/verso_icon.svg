<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Deep Leather Brown Rounded Square -->
  <rect x="50" y="50" width="924" height="924" rx="220" fill="#4A3B32" stroke="#2C221C" stroke-width="20"/>
  
  <!-- Subtle Texture/Noise Effect (Simulated with dots) -->
  <pattern id="leatherTexture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1.5" fill="#3E3028" opacity="0.5"/>
    <circle cx="2" cy="5" r="1" fill="#3D2F27" opacity="0.5"/>
  </pattern>
  <rect x="60" y="60" width="904" height="904" rx="210" fill="url(#leatherTexture)" opacity="0.3"/>

  <!-- Drop Shadow for Content -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.4"/>
  </filter>
  
  <!-- Open Book Graphic -->
  <g transform="translate(162, 212)" filter="url(#shadow)">
    <!-- Gold Leaf Edges / Cover -->
    <path d="M0 0 H 700 V 600 H 0 Z" fill="none"/> <!-- Bounding box for reference -->
    
    <!-- Left Page (Verso) -->
    <path d="M 50 50 C 50 50, 350 70, 350 70 V 550 C 350 550, 50 530, 50 530 V 50 Z" fill="#F5F5DC" stroke="#D4AF37" stroke-width="4"/>
    <!-- Right Page (Recto) -->
    <path d="M 350 70 C 350 70, 650 50, 650 50 V 530 C 650 530, 350 550, 350 550 V 70 Z" fill="#FdfdEE" stroke="#D4AF37" stroke-width="4"/>
    
    <!-- Spine -->
    <path d="M 350 70 V 550" stroke="#E0E0C0" stroke-width="2"/>
    <linearGradient id="spineGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.1"/>
    </linearGradient>
    <rect x="330" y="70" width="40" height="480" fill="url(#spineGrad)" opacity="0.3"/>

    <!-- Content on Verso (Left) Page - Highlighted -->
    <rect x="90" y="110" width="200" height="15" rx="2" fill="#4A3B32" opacity="0.9"/>
    <rect x="90" y="140" width="180" height="8" rx="2" fill="#4A3B32" opacity="0.5"/>
    <rect x="90" y="160" width="190" height="8" rx="2" fill="#4A3B32" opacity="0.5"/>
    <rect x="90" y="180" width="210" height="8" rx="2" fill="#4A3B32" opacity="0.5"/>
    <rect x="90" y="200" width="170" height="8" rx="2" fill="#4A3B32" opacity="0.5"/>
    
    <!-- Large 'V' as Drop Cap or Graphic -->
    <text x="120" y="450" font-family="Georgia, serif" font-size="200" fill="#D4AF37" font-weight="bold" opacity="0.9">V</text>

    <!-- Content on Recto (Right) Page - Dimmed -->
    <rect x="390" y="110" width="200" height="8" rx="2" fill="#999" opacity="0.2"/>
    <rect x="390" y="130" width="210" height="8" rx="2" fill="#999" opacity="0.2"/>
    <rect x="390" y="150" width="190" height="8" rx="2" fill="#999" opacity="0.2"/>
    <rect x="390" y="170" width="200" height="8" rx="2" fill="#999" opacity="0.2"/>
  </g>
</svg>
